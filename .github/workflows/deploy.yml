name: CDK Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install CDK dependencies
        run: |
          cd cdk
          npm ci

      - name: Build CDK
        run: |
          cd cdk
          npm run build

      - name: Run tests
        run: |
          cd cdk
          npm test

      - name: Deploy CDK stacks
        run: |
          cd cdk
          ./node_modules/.bin/cdk deploy --all --require-approval never --outputs-file cdk-outputs.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          DOMAIN_NAME: blog.aldolushkja.it
          CERTIFICATE_ARN: ${{ secrets.BLOG_CERTIFICATE_ARN }}

      - name: Verify deploy actually ran
        run: |
          cd cdk
          if [ ! -s cdk-outputs.json ] || ! grep -q SiteUrl cdk-outputs.json; then
            echo "::error::cdk-outputs.json is missing/empty — the deploy step did not run CloudFormation (e.g. 'cdk' resolved to the app entrypoint instead of the aws-cdk CLI)."
            exit 1
          fi
          cat cdk-outputs.json
